<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Subtitle Studio</title>
<script src="/shared/theme.js"></script>
<link rel="stylesheet" href="/shared/ui.css">
<style>
.wrap{max-width:1180px;margin:0 auto;padding:22px 20px 80px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.top h1{font-size:21px;letter-spacing:-.02em;flex:1}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:20px;align-items:start}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:16px}
.box h3{font-size:15px;margin-bottom:10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:8px 0}
.row>label{color:var(--mut);font-size:13px;min-width:90px}
.drop{border:2px dashed var(--line3);border-radius:var(--r);padding:34px;text-align:center;color:var(--mut);cursor:pointer}
.drop.on{border-color:var(--ac);background:var(--ac-soft)}
#stage{position:relative;background:#000;border-radius:var(--r);overflow:hidden;display:flex;justify-content:center}
#stage img{max-width:100%;max-height:68vh;display:block}
#stage .busy{position:absolute;top:8px;right:10px;font-size:12px;color:#fff;background:rgba(0,0,0,.55);padding:2px 8px;border-radius:8px}
#scrub{width:100%;margin-top:10px}
.styles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;max-height:320px;overflow:auto;padding-right:4px}
.st{border:1px solid var(--line2);border-radius:var(--r-sm);padding:8px 10px;cursor:pointer;background:var(--raise);font-size:12.5px;line-height:1.3}
.st b{display:block;font-size:15px;margin-bottom:3px}
.st.on{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac-ring)}
.cues{max-height:360px;overflow:auto}
.cue{display:grid;grid-template-columns:56px 56px 1fr;gap:6px;margin-bottom:6px}
.cue input{padding:6px 8px;min-height:0}
.bar{height:8px;background:var(--raise2);border-radius:6px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--ac-strong);width:0}
.mut{color:var(--mut);font-size:13px}
.err{color:var(--bad-tx);font-size:13px;margin-top:6px}
button.sm{padding:6px 11px;min-height:0;font-size:13px}
</style></head><body>
<div class="wrap">
  <div class="top"><h1>Subtitle Studio</h1>
    <select id="ui" style="width:auto"><option value="en">English</option><option value="ru">Русский</option><option value="uk">Українська</option></select>
    <button class="sm" id="theme">◐</button></div>

  <div id="s1" class="box"><div class="drop" id="drop"><div style="font-size:30px">🎬</div><b data-t="drop">Drop a video here or click to choose</b><div class="mut" data-t="dropsub">Any video: vertical, horizontal or square</div></div><input type="file" id="file" accept="video/*" hidden><div class="bar" id="upbar" hidden><i></i></div><div class="err" id="uperr"></div></div>

  <div id="app" hidden><div class="grid">
    <div>
      <div class="box"><div id="stage"><img id="pv" alt=""><span class="busy" id="busy" hidden>…</span></div>
        <input type="range" id="scrub" min="0" max="1000" value="0"><div class="mut" id="tinfo"></div></div>
      <div class="box"><h3 data-t="h_text">Text</h3>
        <div id="nocues">
          <div class="row"><label data-t="spoken">Spoken language</label><select id="lang" style="width:auto"></select>
            <button id="go" data-t="recog">Recognize speech</button></div>
          <div class="row"><span class="mut" data-t="or">or</span> <button class="sm" id="srtBtn" data-t="imp">Import .srt</button><input type="file" id="srtFile" accept=".srt,.vtt,.txt" hidden></div>
        </div>
        <div id="hascues" hidden>
          <div class="row"><label data-t="trans">Translate to</label><select id="to" style="width:auto"></select><button class="sm" id="tr" data-t="translate">Translate</button><button class="sm" id="orig" hidden data-t="back">Back to original</button></div>
          <div class="cues" id="cues"></div>
          <div class="row"><button class="sm" id="regroup" data-t="regroup">Regroup automatically</button><button class="sm" id="redo" data-t="redo">Recognize again</button></div>
        </div>
        <div class="bar" id="tkbar" hidden><i></i></div><div class="err" id="tkerr"></div>
      </div>
    </div>
    <div>
      <div class="box"><h3 data-t="h_style">Style</h3><div class="styles" id="styles"></div></div>
      <div class="box"><h3 data-t="h_set">Settings</h3>
        <div class="row"><label data-t="accent">Accent colour</label><input type="color" id="accent" value="#ffe600" style="width:56px;padding:2px"><button class="sm" id="accOff" data-t="own">Style's own</button></div>
        <div class="row"><label data-t="size">Size</label><input type="range" id="scale" min="0.6" max="1.6" step="0.05" value="1" style="flex:1"></div>
        <div class="row"><label data-t="lines">Lines</label><select id="lines" style="width:auto"><option value="">auto</option><option>1</option><option>2</option><option>3</option></select></div>
        <div class="row"><label data-t="pos">Height</label><input type="range" id="posy" min="0.1" max="0.9" step="0.01" value="0.75" style="flex:1"><button class="sm" id="posOff" data-t="own">Style's own</button></div>
        <div class="row"><label data-t="font">Font</label><select id="font" style="flex:1"><option value="">Style's own</option></select></div>
        <div class="mut" data-t="fontnote">Other alphabets (Chinese, Arabic, Thai…) use a system font that has the letters.</div>
      </div>
      <div class="box"><h3 data-t="h_out">Result</h3>
        <div class="row"><button id="burn" data-t="burn">Burn subtitles into the video</button></div>
        <div class="bar" id="rbar" hidden><i></i></div><div class="err" id="rerr"></div>
        <div class="row" id="dl" hidden><a href="#" id="dlv"><button class="sm" data-t="dlv">Download video</button></a>
          <a id="dls" href="#"><button class="sm">.srt</button></a><a id="dlt" href="#"><button class="sm">.txt</button></a></div>
        <div class="row" id="dl2" hidden><a id="dls2" href="#"><button class="sm">.srt</button></a><a id="dlt2" href="#"><button class="sm">.txt</button></a></div>
      </div>
    </div>
  </div></div>
</div>
<script src="app.js"></script>
</body></html>
