<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Video Studio · Tasks</title>
<script src="/theme.js"></script><link rel="stylesheet" href="/ui.css"><style>textarea{min-height:110px}.cr{display:grid;grid-template-columns:34px minmax(0,1.3fr) minmax(0,1.6fr) minmax(0,1.2fr);gap:14px;padding:14px 0;border-top:1px solid var(--line);align-items:start}@media (max-width:900px){.cr{grid-template-columns:28px 1fr}.cr>div:nth-child(n+3){grid-column:1 / -1}}</style></head><body>
<header id="nav"></header><script src="/nav.js"></script>
<main class="split"><aside><button style="width:100%;margin-bottom:8px" onclick="newTask()">+ New task</button><div style="margin-bottom:12px"><input id="asref" placeholder="Asana task link or ID" style="margin-bottom:6px"><button class="sec" style="width:100%" onclick="asanaImport()">Import from Asana</button><div class="badge" id="asmsg" style="margin-top:4px"></div></div><div id="tlist"></div></aside><section id="view"><p class="badge">Pick or create a task.</p></section></main>
<script src="/i18n.js"></script>
<script src="/dreamface.js"></script>
<script>
const $=s=>document.querySelector(s);const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const j=(u,b)=>fetch(u,b===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(r=>r.json());
let TASKS=[],TV=null,NICHES=[],SPLIT=null,MSG='';
async function init(){NICHES=await j('/api/niches');FMT=await j('/api/formats');await list();if(location.hash.length>1)openTask(location.hash.slice(1))}
async function list(){TASKS=await j('/api/tasks');$('#tlist').innerHTML=TASKS.map(t=>`<div class="it ${TV&&TV.task.id==t.id?'on':''}" onclick="openTask('${t.id}')"><span>${esc(t.title)}</span><span class="badge">${t.finished}/${t.count}${t.problems?' ⚠':''}</span></div>`).join('')||'<div class="badge">No tasks yet.</div>'}
async function newTask(){const n=await uiPrompt('Task name?');if(!n)return;const t=await j('/api/tasks',{title:n});await list();openTask(t.id)}
async function openTask(id){TV=await j('/api/tasks/'+id);location.hash=id;SPLIT=null;MSG='';list();draw();live()}
const LIFE_LABEL={review:['On review','ac'],changes:['Edits','warn'],approved:['Approved','ok']};
const STATE_LABEL={done:'Done',problem:'Needs fixing',review:'Rendered: review',editing:'Editing','ready for analysis':'Ready for analysis',draft:'Draft'};
const BUSY=['analyzing','rendering','queued','assembling'];
let FMT=[];
const fmtInfo=id=>FMT.find(f=>f.id===id)||{id,label:id,use:''};
const fmtShape=id=>id.startsWith('vertical')?'width:18px;height:32px':id.startsWith('portrait')?'width:24px;height:30px':id.startsWith('landscape')?'width:34px;height:19px':'width:26px;height:26px';
function presetLine(t){const n=NICHES.find(x=>x.id===t.niche);if(!t.niche||!n)return '<div class="badge">Choose a niche to use its preset.</div>';
 const p=(n.defaults||{}).preset||{};const bits=[];if(p.subStyle)bits.push(p.subStyle);if(p.font)bits.push(p.font);if(p.transition)bits.push(p.transition);if(p.audio&&p.audio.music)bits.push(p.audio.music);
 return Object.keys(p).length?`<div><span class="pill ok">Preset</span> <span class="badge">${esc(n.name)}: ${bits.map(esc).join(' · ')||Object.keys(p).length+' settings'}</span></div>`:`<div class="badge">No preset saved for ${esc(n.name)} yet. Open any project of this niche, finish its Style step and click “Save as niche preset”.</div>`}
function stageTrack(c){return `<div class="chips">${c.stages.map(s=>`<span class="chip ${s.done?'on':''}">${s.done?'✓ ':''}${s.label}</span>`).join('')}</div>`}
function crRow(c){const busy=BUSY.includes(c.status);
 return `<div class="cr"><b style="color:var(--mut)">${c.creativeNo||''}</b>
  <div><a style="color:var(--tx);font-weight:600;text-decoration:none" href="/#${c.id}">${esc(c.name)}</a>${c.variantOf?' <span class="pill">variant</span>':''}<div style="margin-top:6px"><span class="state ${c.state.replace(/ /g,'')}">${STATE_LABEL[c.state]||c.state}</span>${c.auto?' <span class="pill ac">auto</span>':''}${LIFE_LABEL[c.life]?` <span class="pill ${LIFE_LABEL[c.life][1]}" title="${c.lifeDaysLeft!=null?'approved automatically in '+Math.max(0,c.lifeDaysLeft).toFixed(1)+' day(s) without edits':''}">${LIFE_LABEL[c.life][0]}</span>`:''}</div></div>
  <div>${busy?`<div class="row mid" style="gap:10px"><div class="bar" style="flex:1"><i style="width:${Math.round((c.progress||0)*100)}%"></i></div><span class="badge">${c.status==='queued'?'In the queue…':c.status==='rendering'?'Rendering…':'Analyzing…'}</span></div>`:stageTrack(c)}<div class="badge" style="margin-top:6px">→ ${esc(c.next)}</div>${c.attention.map(a=>`<div class="warn">⚠ ${esc(a)}</div>`).join('')}</div>
  <div class="row mid" style="gap:6px;justify-content:flex-end"><a class="btn sec sm" href="/#${c.id}">Open</a><details class="menu"><summary title="More actions">⋯</summary><div class="pop"><div class="row" style="gap:8px"><button class="sec" onclick="variant('${c.id}')">Variant</button></div><div class="row" style="gap:8px;margin-top:8px"><button class="sec" onclick="wf('${c.id}')">Work folder</button>${c.workFolder?`<button class="sec" onclick="openDir('${c.id}')">Open folder</button>`:''}</div></div></details></div></div>`}
function heroHtml(){const S=TV.summary,cs=TV.creatives;const work=cs.filter(c=>BUSY.includes(c.status)).length;
 const ready=cs.filter(c=>c.done.script&&c.done.media&&!(c.done.render&&c.done.analysis)&&!BUSY.includes(c.status)).length;
 return `<div class="row mid"><div><h2 style="margin-bottom:6px">Make the videos</h2><div class="badge">${S.finished} of ${S.total} creative(s) finished${work?' · '+work+' working':''}${ready?' · '+ready+' ready to produce':''}</div>
  <div class="chips" style="margin-top:8px">${Object.entries(S.byState).map(([k,v])=>`<span class="state ${k.replace(/ /g,'')}">${STATE_LABEL[k]||k}: ${v}</span>`).join('')||'<span class="badge">No creatives yet.</span>'}</div></div>
  <button class="lg" onclick="makeAll()" ${S.total?'':'disabled'}>▶ Make all videos</button></div>
  <div class="badge" style="margin-top:12px">One click: analysis, render in every selected size, quality check and work folder for each ready creative. Creatives without a voice or video are skipped.</div>
  ${S.attention.length?`<details class="more"><summary>Needs attention (${S.attention.length})</summary><div class="body">${S.attention.map(a=>`<div class="warn">⚠ ${esc(a.name)}: ${a.items.map(esc).join(' · ')}</div>`).join('')}</div></details>`:''}
  <details class="more"><summary>Step by step</summary><div class="body row mid" style="justify-content:flex-start"><button class="sec" onclick="batch('analyze')">Analyze all ready</button><button class="sec" onclick="batch('render')">Render all ready</button><span class="badge" id="bmsg">${esc(MSG)}</span></div></details>`}
function sizesHtml(t){const main=t.format||'square',ex=(t.exports||[]).filter(f=>f!==main);
 return `<h2>Look and sizes</h2>${presetLine(t)}
  <div class="row" style="margin-top:6px"><div><label>Main size</label><select id="tf" onchange="saveTask(true)">${FMT.map(f=>`<option value="${f.id}" ${main===f.id?'selected':''}>${f.label} · ${f.use}</option>`).join('')}</select></div></div>
  <label>Also export these sizes</label><div class="fmts">${FMT.filter(f=>f.id!==main).map(f=>`<label class="fmt ${ex.includes(f.id)?'on':''}"><input type="checkbox" ${ex.includes(f.id)?'checked':''} onchange="toggleExport('${f.id}',this.checked)"><span class="shape" style="${fmtShape(f.id)}"></span><span><b>${f.label}</b><small>${f.use}</small></span></label>`).join('')}</div>
  <div class="row mid" style="margin-top:14px;justify-content:flex-start"><button class="sec" onclick="applyAll()">Apply preset and sizes to all creatives</button><span class="badge">New creatives of this task start with them automatically.</span></div>`}
function draw(){const t=TV.task,S=TV.summary;
$('#view').innerHTML=`
<div class="phead"><div class="top"><input id="ttl" class="title" value="${esc(t.title)}" onchange="saveTask()" aria-label="Task title"><select class="niche" id="tn" onchange="saveTask(true)"><option value="">No niche</option>${NICHES.map(n=>`<option value="${n.id}" ${t.niche==n.id?'selected':''}>Niche: ${esc(n.name)}</option>`).join('')}</select><span class="pill ${S.total&&S.finished==S.total?'ok':''}">${S.finished}/${S.total}</span>
 <details class="menu"><summary title="More actions">⋯</summary><div class="pop"><button class="danger" onclick="delTask()">Delete task</button></div></details></div>${asanaBar(t)?`<div class="crumb">${asanaBar(t)}</div>`:''}</div>
<div class="card" id="hero">${heroHtml()}</div>
<div class="card">${sizesHtml(t)}</div>
<div class="card"><h2>Creatives</h2><div id="crl">${TV.creatives.map(crRow).join('')||'<div class="badge">No creatives yet: open “Brief and links” below, paste the brief and click “Find creatives in the text”, or add one.</div>'}</div>
 <div class="row mid" style="margin-top:12px;justify-content:flex-start"><button class="sec" onclick="addBlank()">+ Add empty creative</button></div></div>
<details class="more" ${SPLIT?'open':''}><summary>Brief and links</summary><div class="body">
 <label>Description / brief (paste the task text here)</label><textarea id="td" onchange="saveTask()">${esc(t.description)}</textarea>
 <div class="row"><div><label>Comments</label><textarea id="tc" style="min-height:70px" onchange="saveTask()">${esc(t.comments)}</textarea></div><div><label>Links (one per line)</label><textarea id="tl" style="min-height:70px" onchange="saveTask()">${esc((t.links||[]).join('\n'))}</textarea></div></div>
 <div class="row mid" style="margin-top:12px;justify-content:flex-start"><button class="sec" onclick="detect()">Find creatives in the text</button></div>${SPLIT?splitUi():''}</div></details>
<details class="more"><summary>Google documents (${(t.docs||[]).length})</summary><div class="body">${docsCard(t)}</div></details>
${CFGT.heygen?`<details class="more"><summary>Avatar videos (HeyGen)</summary><div class="body">${heygenCard()}</div></details>`:''}
<details class="more"><summary>DreamFace (manual lip-sync)</summary><div class="body">${dfCard(t.id,null)}</div></details>`;}
// live refresh while something is running: only the status parts are redrawn, so typing is never interrupted
let LIVE=null;
function live(){clearInterval(LIVE);LIVE=null;if(!TV||!TV.creatives.some(c=>BUSY.includes(c.status)))return;
 LIVE=setInterval(async()=>{if(!TV)return;const id=TV.task.id;const v=await j('/api/tasks/'+id);if(!TV||TV.task.id!==id)return;TV=v;const h=$('#hero'),l=$('#crl');if(h)h.innerHTML=heroHtml();if(l)l.innerHTML=TV.creatives.map(crRow).join('');list();if(!TV.creatives.some(c=>BUSY.includes(c.status))){clearInterval(LIVE);LIVE=null}},3000)}
async function toggleExport(id,on){const s=new Set(TV.task.exports||[]);on?s.add(id):s.delete(id);TV.task=await j('/api/tasks',{id:TV.task.id,exports:[...s]});draw()}
async function applyAll(){const r=await j('/api/tasks/'+TV.task.id+'/apply-preset',{});if(r.error){toast(r.error);return}toast('Applied to '+r.done.length+' creative(s)'+(r.skipped.length?'; skipped: '+r.skipped.map(s=>s.name+' ('+s.why+')').join('; '):''));TV=await j('/api/tasks/'+TV.task.id);draw()}
async function makeAll(){const id=TV.task.id;const plan=await j('/api/tasks/'+id+'/run-all',{dry:true});if(plan.error){toast(plan.error);return}
 if(!plan.start.length){toast('Nothing to start. '+plan.skipped.map(s=>s.name+' ('+s.why+')').join('; '));return}
 const ex=(TV.task.exports||[]).filter(f=>f!==(TV.task.format||'square'));
 const body=`<div class="badge">Analyze → render${ex.length?' ('+(1+ex.length)+' size(s))':''} → work folder.</div><div style="margin:12px 0">${plan.start.map(x=>`<div>• ${esc(x.name)} <span class="badge">${x.from==='render'?'render only':'full run'}</span></div>`).join('')}</div>${plan.skipped.length?'<div class="badge">Skipped:</div>'+plan.skipped.map(s=>`<div class="badge">– ${esc(s.name)} (${esc(s.why)})</div>`).join(''):''}`;
 if(!await uiAsk('Make '+plan.start.length+' video(s)?',body,'Start'))return;
 const r=await j('/api/tasks/'+id+'/run-all',{});toast(r.started.length+' started'+(r.skipped.length?', skipped: '+r.skipped.map(s=>s.name+' ('+s.why+')').join('; '):''));
 TV=await j('/api/tasks/'+id);draw();live()}
async function saveTask(redraw){const t=await j('/api/tasks',{id:TV.task.id,title:$('#ttl').value,niche:$('#tn').value,format:$('#tf').value,description:$('#td').value,comments:$('#tc').value,links:$('#tl').value,exports:TV.task.exports});TV.task=t;list();if(redraw)draw()}
async function delTask(){if(!await uiConfirm('Delete this task? Its creatives are kept as normal projects.','Delete',true))return;await j('/api/tasks/'+TV.task.id+'/delete',{});TV=null;location.hash='';$('#view').innerHTML='<p class="badge">Pick or create a task.</p>';list()}
async function detect(){await saveTask();SPLIT=(await j('/api/tasks/'+TV.task.id+'/split',{})).items.map(x=>({...x,use:x.use!==false}));draw()}
function splitUi(){return `<div style="margin-top:12px;border-top:1px solid var(--line);padding-top:12px"><b>${SPLIT.length} creative(s) found</b> <span class="badge">Edit names and scripts, untick what you do not need.</span>
 ${SPLIT.map((x,i)=>`<div style="margin:8px 0;padding:10px;border:1px solid var(--line);border-radius:8px"><label style="display:flex;gap:8px;align-items:center;color:var(--tx);margin:0"><input type="checkbox" style="width:auto" ${x.use?'checked':''} onchange="SPLIT[${i}].use=this.checked"> <input value="${esc(x.name)}" onchange="SPLIT[${i}].name=this.value"></label><div class="badge">${x.blocks} block(s) · ${x.words} words${x.from?' · from: '+esc(x.from):''}</div><textarea onchange="SPLIT[${i}].script=this.value" style="min-height:80px;margin-top:6px">${esc(x.script)}</textarea></div>`).join('')}
 <div class="row"><button onclick="createSplit()">Create ${SPLIT.filter(x=>x.use).length} creative(s)</button><button class="sec" onclick="SPLIT=null;draw()">Cancel</button></div></div>`}
async function createSplit(){const items=SPLIT.filter(x=>x.use).map(x=>({name:x.name,script:x.script}));const r=await j('/api/tasks/'+TV.task.id+'/creatives',{items});if(r.error){alert(r.error);return}openTask(TV.task.id)}
async function addBlank(){await j('/api/tasks/'+TV.task.id+'/creatives',{items:[{name:'Creative '+(TV.creatives.length+1),script:'Write the script here.'}]});openTask(TV.task.id)}
async function variant(id){const r=await j('/api/projects/'+id+'/duplicate',{});if(r.error){alert(r.error);return}openTask(TV.task.id)}
async function wf(id){const r=await j('/api/projects/'+id+'/workfolder',{});if(r.error){alert(r.error);return}openTask(TV.task.id)}
async function openDir(id){const c=TV.creatives.find(x=>x.id==id);const r=await j('/api/open',{path:c.workFolder});if(r.error)alert(r.error)}
async function batch(act){MSG='Working…';draw();const r=await j('/api/tasks/'+TV.task.id+'/batch',{action:act});MSG=`${r.started.length} started`+(r.skipped.length?', skipped: '+r.skipped.map(s=>s.name+' ('+s.why+')').join('; '):'');const t=TV.task.id;TV=await j('/api/tasks/'+t);draw();live()}
function asanaBar(t){if(t.source!=='asana')return '';const a=t.asana||{};return `<div class="row" style="margin-bottom:8px"><div class="badge">Asana task${a.url?' · <a style="color:var(--ac)" target="_blank" href="'+esc(a.url)+'">open</a>':''}${a.assignee?' · '+esc(a.assignee):''}${a.due?' · due '+esc(a.due):''}${(a.subtasks||[]).length?' · '+a.subtasks.length+' subtask(s)':''}</div><button class="sec" onclick="asanaUpdate()">Update from Asana</button></div>`}
function docsCard(t){const d=t.docs||[];return `<div class="card"><h2>Google documents</h2>
 ${d.map(x=>`<div style="padding:6px 0;border-top:1px solid var(--line)"><div class="row" style="gap:8px"><div style="flex:1"><a style="color:var(--tx)" target="_blank" href="${esc(x.url)}">${esc(x.title)}</a> <span class="badge">${x.status==='ok'?(x.words?x.words+' words':''):''}</span></div><span class="state ${x.status==='ok'?'done':x.status==='private'||x.status==='needs-key'?'review':'problem'}">${x.status==='ok'?'Read':x.status==='private'?'Not shared':x.status==='needs-key'?'Needs key':x.status==='unsupported'?'Not supported':x.status}</span></div>${x.note?'<div class="warn">'+esc(x.note)+'</div>':''}</div>`).join('')||'<div class="badge">No Google links found yet. Links in the brief, comments and Asana task are picked up automatically.</div>'}
 <div class="row" style="margin-top:8px"><input id="adddoc" placeholder="Add a Google Docs / Drive link"><button class="sec" onclick="addDoc()">Add</button><button class="sec" onclick="refreshDocs()">Refresh documents</button></div>
 <div class="badge" style="margin-top:4px">Documents must be shared as “Anyone with the link can view”. Private documents cannot be read.</div></div>`}
async function asanaImport(){const ref=$('#asref').value.trim();if(!ref)return;$('#asmsg').textContent='Importing…';const r=await j('/api/asana/import',{ref});if(r.error){$('#asmsg').textContent=r.error;return}$('#asmsg').textContent=(r.updated?'Updated: ':'Imported: ')+r.view.task.title;$('#asref').value='';await list();openTask(r.id)}
async function asanaUpdate(){const r=await j('/api/asana/import',{ref:TV.task.sourceRef});if(r.error){alert(r.error);return}openTask(r.id)}
async function addDoc(){const u=$('#adddoc').value.trim();if(!u)return;TV=await j('/api/tasks/'+TV.task.id+'/docs',{add:u});draw()}
async function refreshDocs(){TV=await j('/api/tasks/'+TV.task.id+'/docs',{});draw()}
let CFGT={},AVT=null,HGB={prev:null,msg:'',test:true,avatarId:''};
function heygenCard(){if(!CFGT.heygen)return '';if(AVT===null){AVT=[];j('/api/heygen/avatars').then(r=>{AVT=r.avatars||[];draw()})}
return `<div class="card"><h2>Avatar videos (HeyGen)</h2><div class="badge">One check and one confirmation for the whole task. Each creative needs a voice; creatives that already have a presenter video are skipped.</div>
<div class="row" style="margin-top:6px"><div><label>Avatar</label><select onchange="HGB.avatarId=this.value;HGB.prev=null"><option value="">— choose —</option>${AVT.map(a=>'<option value="'+a.id+'" '+(a.id===HGB.avatarId?'selected':'')+'>'+esc(a.name)+'</option>').join('')}</select></div><label style="display:flex;gap:8px;align-items:center;color:var(--tx);flex:0 0 auto;margin-top:18px"><input type="checkbox" style="width:auto" ${HGB.test?'checked':''} onchange="HGB.test=this.checked;HGB.prev=null;draw()"> Test mode (free, watermarked)</label><button class="sec" style="margin-top:18px" onclick="hgbCheck()">Check</button></div>
${HGB.msg?'<div class="badge" style="color:#e5484d">'+esc(HGB.msg)+'</div>':''}
${HGB.prev?'<div style="margin-top:8px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)"><b>'+HGB.prev.items.length+' avatar video(s), '+HGB.prev.totalSeconds+' s of audio in total</b> · '+(HGB.prev.test?'<span style="color:#3fb950">test mode: no credits, watermark</span>':'<span style="color:#d29922">real generation: uses your HeyGen credits</span>')+(HGB.prev.quota!=null?'<div class="badge">Remaining quota reported by HeyGen: '+esc(HGB.prev.quota)+'</div>':'')+HGB.prev.items.map(x=>'<div class="badge">• '+esc(x.name)+' · '+x.seconds+' s'+(x.replaces?' · replaces its presenter video':'')+'</div>').join('')+'<div class="row" style="margin-top:8px"><button onclick="hgbRun()">'+(HGB.prev.test?'Generate '+HGB.prev.items.length+' test video(s)':'Generate '+HGB.prev.items.length+' video(s) (uses credits)')+'</button><button class="sec" onclick="HGB.prev=null;draw()">Cancel</button></div></div>':''}</div>`}
async function hgbCheck(){HGB.msg='';HGB.prev=null;if(!HGB.avatarId){HGB.msg='Choose an avatar first.';draw();return}const r=await j('/api/tasks/'+TV.task.id+'/heygen/preview',{avatarId:HGB.avatarId,test:HGB.test});if(r.error)HGB.msg=r.error;else HGB.prev=r;draw()}
async function hgbRun(){const r=await j('/api/tasks/'+TV.task.id+'/heygen/run',{token:HGB.prev.token});HGB.prev=null;if(r.error)HGB.msg=r.error;else HGB.msg=r.started.length+' started'+(r.failed.length?'; failed: '+r.failed.map(f=>f.name+' ('+f.why+')').join('; '):'')+'. Videos appear in each creative when HeyGen finishes (the app checks every 20 s).';draw()}
j('/api/settings').then(c=>{CFGT=c});
init();
</script></body></html>
